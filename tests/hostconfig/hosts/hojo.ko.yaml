"hojo.ko":
  config:
    ssh:
      user: ko
      port: 2202

    discs:
      - device: /dev/mmcblk0
        table: gpt
        partitions:
          - name: efi
            size: 1G
            filesystem: fat32
            mount: /boot/efi

          - name: swap
            size: 16G
            type: swap

          - name: root
            size: remaining
            filesystem: ext4
            mount: /

  recipes:
    - default: {}
    - git: {}
    - zsh: {}

    - hyprland:
        hyprland_config_dir: files/hyprland/{hostname}

    - zsh:
        foo: bar

recipes:
  hyprland:
    - package: [hyprland, "{extra_packages}"]

    - dir:
        src: "{hyprland_config_dir}"
        dest: "$home$/.config/hyprland"